<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A GPT that trains in this tab, on every CPU core</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e14; color: #d7dce5; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; color: #fff; }
  header span { color: #8b95a7; }
  header div { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  button { font: inherit; background: #131722; color: inherit; border: 1px solid #232a3a; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  a { color: #c084fc; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 18px 0 12px; }
  .stats div, #chart, figure { background: #131722; border: 1px solid #232a3a; border-radius: 8px; }
  .stats div { padding: 10px 14px; color: #8b95a7; }
  .stats b { display: block; font-size: 22px; color: #fff; }
  .mid { display: grid; grid-template-columns: 1fr 264px; gap: 12px; }
  #chart { display: block; width: 100%; height: 280px; }
  #attn { display: block; width: 230px; height: 230px; image-rendering: pixelated; }
  .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  figure { margin: 0; padding: 12px 16px; min-width: 0; }
  figcaption { color: #8b95a7; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .samples figure:last-child figcaption { color: #c084fc; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; height: 250px; overflow: hidden; }
  #note { color: #fb7185; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(3, 1fr); } .mid, .samples { grid-template-columns: 1fr; } }
</style>
<main>
  <header>
    <h1>A GPT that trains in this tab</h1>
    <span id="sub">backprop written by hand · plain JavaScript</span>
    <div><span id="note"></span><button id="pause">Pause</button><button id="restart">Restart</button><a href="../">all five</a></div>
  </header>
  <section class="stats">
    <div><b id="params">–</b>parameters</div>
    <div><b id="workers">–</b>CPU workers</div>
    <div><b id="step">0</b>training steps</div>
    <div><b id="rate">–</b>chars/second</div>
    <div><b id="loss">–</b>training loss</div>
    <div><b id="held">–</b>held-out loss</div>
  </section>
  <section class="mid">
    <canvas id="chart"></canvas>
    <figure><figcaption>attention, last layer</figcaption><canvas id="attn" width="64" height="64"></canvas></figure>
  </section>
  <section class="samples">
    <figure><figcaption>what it wrote before training</figcaption><pre id="s0"></pre></figure>
    <figure><figcaption id="capN">what it writes now</figcaption><pre id="sN"></pre></figure>
  </section>
</main>
<script src="corpus.js"></script>
<script src="gpt.js"></script>
<script>
const $ = id => document.getElementById(id);
const chars = [...new Set(CORPUS)].sort(), stoi = new Map(chars.map((c, i) => [c, i]));
const data = Int32Array.from(CORPUS, c => stoi.get(c)), cut = data.length - Math.max(2000, data.length / 20 | 0);
const train = data.slice(0, cut), val = data.slice(cut);       // the model never trains on the last 5%

const CFG = { vocab: chars.length, ctx: 64, d: 64, heads: 4, layers: 4 };
const LR = 3e-3, BOX_MS = 60, HORIZON_S = 90;                 // learning rate decays to a tenth over the first 90 s of training
// One core stays free for this page and one writes the samples. `?single` trains on the page's own thread.
const CORES = location.search.includes('single') || !window.Worker ? 0 : Math.max(1, Math.min(navigator.hardwareConcurrency || 4, 16) - 2);

let model, workers = [], sampler, losses, heldAt, ema, clock, seen, running = true, busy, pending, got, lossSum, t0, drawn, soloTimer;

const lr = () => LR * Math.min(1, (losses.length + 1) / 30) * (0.1 + 0.45 * (1 + Math.cos(Math.PI * Math.min(1, clock / HORIZON_S))));

function record(loss, n) {
  ema = ema == null ? loss : ema * 0.9 + loss * 0.1;
  losses.push(ema); seen += n;
  if (!drawn) drawn = requestAnimationFrame(draw);
}

// ---- parallel training: every worker gets the weights, trains for a time box, returns one summed gradient
function round() {
  if (!running || busy || !workers.length) return;
  busy = true; pending = workers.length; got = 0; lossSum = 0; t0 = performance.now();
  for (const w of workers) w.postMessage({ w: model.W, ms: BOX_MS });
}
function onGradient({ data: m }) {
  for (let i = 0; i < model.count; i++) model.G[i] += m.g[i];
  got += m.n; lossSum += m.loss;
  if (--pending) return;
  busy = false; clock += (performance.now() - t0) / 1000;
  model.step(lr(), got);                           // one Adam step on the average over every window of every worker
  record(lossSum / got, got);
  round();
}
const askSample = () => sampler && sampler.postMessage({ w: model.W, sample: 300, prompt: [stoi.get('\n')], step: losses.length });

function onSample({ ids, attn, T, held, step }) {
  const text = ids.map(i => chars[i]).join('');
  if (step) { $('sN').textContent = text; $('capN').textContent = `what it writes after ${step} steps`; heldAt.push([step, held]); $('held').textContent = held.toFixed(3); }
  else $('s0').textContent = text;
  const c = $('attn'), g = c.getContext('2d'), img = g.createImageData(T, T);
  c.width = c.height = T;
  for (let i = 0; i < T * T; i++) img.data.set([192, 132, 252, 255 * Math.sqrt(attn[i])], i * 4);   // row = a character, column = one it reads
  g.putImageData(img, 0, 0);
  if (!drawn) drawn = requestAnimationFrame(draw);
}

// ---- fallback: the same maths on this thread, four windows per step
function solo() {
  if (workers.length) return;
  if (running) {
    const t = performance.now(), l = model.trainStep(train, 4, lr());
    clock += (performance.now() - t) / 1000; record(l, 4);
    if (losses.length % 100 === 0) soloSample(100);
  }
  soloTimer = setTimeout(solo, 0);
}
function soloSample(n) {
  const ids = model.sample([stoi.get('\n')], n), { P, T } = TinyGPT.lastAttention(), attn = P.slice(0, T * T);
  let held = 0;
  for (let i = 0; i < 8; i++) { const a = (val.length - CFG.ctx - 1) * i / 8 | 0; held += model.evaluate(val.subarray(a, a + CFG.ctx), val.subarray(a + 1, a + CFG.ctx + 1)); }
  onSample({ ids, attn, T, held: held / 8, step: losses.length });
}

function fail(e) {
  if (!workers.length && !sampler) return;     // already on one thread; the other workers report the same failure
  $('note').textContent = `workers failed (${e.message || 'could not start'}), training on one thread`;
  start(0);
}

function start(cores = CORES) {
  for (const w of [...workers, sampler]) if (w) w.terminate();
  clearTimeout(soloTimer); workers = []; sampler = null; busy = false;
  model = TinyGPT.GPT(CFG);
  losses = []; heldAt = []; ema = null; clock = 0; seen = 0;
  $('params').textContent = model.count.toLocaleString('en'); $('workers').textContent = cores || 1;
  $('sub').textContent = `${CFG.layers}-layer transformer · backprop written by hand · ${cores || 1} CPU ${cores > 1 ? 'workers' : 'thread'}`;
  $('sN').textContent = ''; $('capN').textContent = 'what it writes now'; $('held').textContent = '–';
  try {
    const spawn = handler => { const w = new Worker('worker.js'); w.onerror = fail; w.onmessage = handler; w.postMessage({ cfg: CFG, train, val }); return w; };
    for (let i = 0; i < cores; i++) workers.push(spawn(onGradient));
    if (cores) sampler = spawn(e => { if (e.target === sampler) { onSample(e.data); setTimeout(() => e.target === sampler && askSample(), 3000); } });
  } catch (e) { return fail(e); }
  if (cores) { askSample(); round(); } else { soloSample(100); solo(); }
}

function draw() {
  drawn = 0;
  if (!losses.length) return;
  $('step').textContent = losses.length; $('loss').textContent = ema.toFixed(3); $('rate').textContent = Math.round(seen * CFG.ctx / clock).toLocaleString('en');
  const c = $('chart'), s = devicePixelRatio, W = c.clientWidth, H = c.clientHeight, g = c.getContext('2d');
  if (c.width !== W * s) { c.width = W * s; c.height = H * s; }
  g.setTransform(s, 0, 0, s, 0, 0); g.clearRect(0, 0, W, H);
  const top = Math.log(chars.length), lo = 1, hi = top + 0.3, n = Math.max(300, losses.length);
  const X = i => 44 + (W - 60) * i / n, Y = v => 14 + (H - 40) * (hi - Math.max(v, lo)) / (hi - lo);
  g.font = '12px ui-monospace, Menlo, monospace'; g.fillStyle = '#8b95a7'; g.strokeStyle = '#232a3a'; g.lineWidth = 1;
  for (let v = lo; v <= hi; v += 0.5) { g.beginPath(); g.moveTo(44, Y(v)); g.lineTo(W - 16, Y(v)); g.stroke(); g.fillText(v.toFixed(1), 12, Y(v) + 4); }
  g.fillText(`${n} steps · ${Math.round(clock)} s`, W - 150, H - 8);
  g.setLineDash([5, 5]); g.strokeStyle = '#8b95a7'; g.beginPath(); g.moveTo(44, Y(top)); g.lineTo(W - 16, Y(top)); g.stroke(); g.setLineDash([]);
  g.fillText(`random guessing: ln(${chars.length}) = ${top.toFixed(2)}`, 56, Y(top) - 6);
  g.strokeStyle = '#c084fc'; g.lineWidth = 2; g.beginPath();
  losses.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.stroke();
  g.fillStyle = '#fff';                            // held-out loss, measured each time a sample is written
  for (const [i, v] of heldAt) { g.beginPath(); g.arc(X(i), Y(v), 3, 0, 7); g.fill(); }
  g.fillStyle = '#c084fc'; g.fillText('━ training', 56, H - 8); g.fillStyle = '#fff'; g.fillText('● held-out', 150, H - 8);
}

$('pause').onclick = () => { running = !running; $('pause').textContent = running ? 'Pause' : 'Resume'; round(); };
$('restart').onclick = () => start();
onresize = draw;
start();
</script>
</html>
