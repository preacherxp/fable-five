<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A GPT that trains in this tab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e14; color: #d7dce5; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; color: #fff; }
  header span { color: #8b95a7; }
  header div { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  button { font: inherit; background: #131722; color: inherit; border: 1px solid #232a3a; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  a { color: #f5a524; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 12px; }
  .stats div, canvas, figure { background: #131722; border: 1px solid #232a3a; border-radius: 8px; }
  .stats div { padding: 10px 16px; color: #8b95a7; }
  .stats b { display: block; font-size: 24px; color: #fff; }
  canvas { display: block; width: 100%; height: 280px; }
  .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  figure { margin: 0; padding: 12px 16px; min-width: 0; }
  figcaption { color: #8b95a7; margin-bottom: 6px; }
  figure:last-child figcaption { color: #f5a524; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; height: 250px; overflow: hidden; }
  @media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } .samples { grid-template-columns: 1fr; } }
</style>
<main>
  <header>
    <h1>A GPT that trains in this tab</h1>
    <span>2-layer transformer · backprop written by hand · plain JavaScript</span>
    <div><button id="pause">Pause</button><button id="restart">Restart</button><a href="../">all five</a></div>
  </header>
  <section class="stats">
    <div><b id="params">–</b>parameters</div>
    <div><b id="step">0</b>training steps</div>
    <div><b id="loss">–</b>loss (nats per character)</div>
    <div><b id="rate">–</b>steps per second</div>
  </section>
  <canvas id="chart"></canvas>
  <section class="samples">
    <figure><figcaption>what it wrote before training</figcaption><pre id="s0"></pre></figure>
    <figure><figcaption id="capN">what it writes now</figcaption><pre id="sN"></pre></figure>
  </section>
</main>
<script src="corpus.js"></script>
<script src="gpt.js"></script>
<script>
const $ = id => document.getElementById(id);
const chars = [...new Set(CORPUS)].sort(), stoi = new Map(chars.map((c, i) => [c, i]));
const data = Int32Array.from(CORPUS, c => stoi.get(c));
const CTX = 32, BATCH = 8, SAMPLE_EVERY = 200;
let model, losses, ema, running = true, rate = 0;

const write = n => model.sample([stoi.get('\n')], n).map(i => chars[i]).join('');

function restart() {
  model = TinyGPT.GPT({ vocab: chars.length, ctx: CTX, d: 48, heads: 4, layers: 2 });
  losses = []; ema = null;
  $('params').textContent = model.count.toLocaleString('en');
  $('s0').textContent = write(300);
  $('sN').textContent = ''; $('capN').textContent = 'what it writes now';
}

function draw() {
  const c = $('chart'), s = devicePixelRatio, W = c.clientWidth, H = c.clientHeight, g = c.getContext('2d');
  if (c.width !== W * s) { c.width = W * s; c.height = H * s; }
  g.setTransform(s, 0, 0, s, 0, 0); g.clearRect(0, 0, W, H);
  const top = Math.log(chars.length), lo = 1, hi = top + 0.3, n = Math.max(600, losses.length);
  const X = i => 44 + (W - 60) * i / n, Y = v => 14 + (H - 40) * (hi - v) / (hi - lo);
  g.font = '12px ui-monospace, Menlo, monospace'; g.fillStyle = '#8b95a7'; g.strokeStyle = '#232a3a'; g.lineWidth = 1;
  for (let v = lo; v <= hi; v += 0.5) { g.beginPath(); g.moveTo(44, Y(v)); g.lineTo(W - 16, Y(v)); g.stroke(); g.fillText(v.toFixed(1), 12, Y(v) + 4); }
  g.fillText(`${n} steps`, W - 90, H - 8);
  g.setLineDash([5, 5]); g.strokeStyle = '#8b95a7'; g.beginPath(); g.moveTo(44, Y(top)); g.lineTo(W - 16, Y(top)); g.stroke(); g.setLineDash([]);
  g.fillText(`random guessing: ln(${chars.length}) = ${top.toFixed(2)}`, 56, Y(top) - 6);
  g.strokeStyle = '#f5a524'; g.lineWidth = 2; g.beginPath();
  losses.forEach((v, i) => i ? g.lineTo(X(i), Y(Math.max(v, lo))) : g.moveTo(X(i), Y(v)));
  g.stroke();
}

function tick() {
  if (running) {
    const t = performance.now(); let k = 0;
    do {
      const l = model.trainStep(data, BATCH, 3e-3 * Math.min(1, (losses.length + 1) / 50));
      ema = ema == null ? l : ema * 0.95 + l * 0.05;
      losses.push(ema); k++;
      if (losses.length % SAMPLE_EVERY === 0) { $('sN').textContent = write(300); $('capN').textContent = `what it writes after ${losses.length} steps`; }
    } while (performance.now() - t < 40);
    const r = k * 1000 / (performance.now() - t);
    rate = rate ? rate * 0.9 + r * 0.1 : r;
    $('step').textContent = losses.length; $('loss').textContent = ema.toFixed(3); $('rate').textContent = rate.toFixed(0);
    draw();
  }
  setTimeout(tick, 0);
}

$('pause').onclick = () => { running = !running; $('pause').textContent = running ? 'Pause' : 'Resume'; };
$('restart').onclick = restart;
onresize = draw;
restart(); tick();
</script>
</html>
