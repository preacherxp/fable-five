<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sql: a SQL engine in one JavaScript file</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #d7dce5; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #232a3a; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 8px 0 0; color: #fff; }
  h1 span { color: #8b95a7; font-weight: 400; }
  button { font: inherit; background: #131722; color: inherit; border: 1px solid #232a3a; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #run { background: #2dd4bf; color: #0b0e14; border-color: #2dd4bf; font-weight: 700; }
  a { color: #2dd4bf; margin-left: auto; }
  main { display: grid; grid-template-columns: 5fr 6fr; min-height: 0; }
  #left { display: grid; grid-template-rows: 1fr auto; border-right: 1px solid #232a3a; min-height: 0; }
  textarea { background: #0b0e14; color: #d7dce5; border: 0; padding: 16px 20px; font: inherit; resize: none; outline: none; white-space: pre; }
  #schema { border-top: 1px solid #232a3a; padding: 10px 20px; color: #8b95a7; font-size: 13px; }
  #schema b { color: #d7dce5; font-weight: 400; }
  #right { overflow: auto; padding: 14px 20px; }
  #status { color: #2dd4bf; margin-bottom: 8px; }
  #status.err { color: #fb7185; }
  ol { margin: 0 0 10px; padding: 9px 14px 9px 42px; overflow-x: auto; background: #131722; border: 1px solid #232a3a; border-radius: 8px; color: #8b95a7; font-size: 13px; line-height: 1.45; }
  ol:empty { display: none; }
  li { white-space: pre; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 14px; border-bottom: 1px solid #232a3a; white-space: nowrap; }
  th { color: #8b95a7; font-weight: 400; }
  td.num { text-align: right; } th.num { text-align: right; }
  td.null { color: #6b7588; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } textarea { min-height: 50vh; } }
</style>
<header>
  <h1>sql <span>CTEs, window functions, B+tree indexes.</span></h1>
  <button id="run">Run (Ctrl+Enter)</button>
  <span id="examples"></span>
  <a href="../">all five</a>
</header>
<main>
  <div id="left"><textarea id="src" spellcheck="false" autocapitalize="off"></textarea><div id="schema"></div></div>
  <div id="right"><div id="status"></div><ol id="plan"></ol><table id="result"></table></div>
</main>
<script src="sql.js"></script>
<script>
const EXAMPLES = {
'top products': `-- The best-selling product of each city in the first quarter.
WITH sales AS (
  SELECT c.city, o.product, SUM(o.qty) AS units
  FROM orders o JOIN customers c ON o.customer_id = c.id
  WHERE o.day BETWEEN 1 AND 90
  GROUP BY c.city, o.product
), ranked AS (
  SELECT city, product, units,
    RANK() OVER (PARTITION BY city ORDER BY units DESC) AS rk,
    ROUND(100 * units /
      SUM(units) OVER (PARTITION BY city), 1) AS pct
  FROM sales
)
SELECT city, product, units, pct,
  SUM(units) OVER (ORDER BY units DESC) AS running
FROM ranked WHERE rk = 1
ORDER BY units DESC;`,
'weekly totals': `-- A recursive CTE builds the calendar; orders are joined onto it.
WITH RECURSIVE weeks(n) AS (
  SELECT 1
  UNION ALL
  SELECT n + 1 FROM weeks WHERE n < 12
)
SELECT w.n AS week,
  COUNT(o.id) AS orders,
  COALESCE(SUM(o.qty * o.price), 0) AS revenue,
  SUM(COALESCE(SUM(o.qty * o.price), 0)) OVER (ORDER BY w.n) AS running,
  COUNT(o.id) - LAG(COUNT(o.id)) OVER (ORDER BY w.n) AS change
FROM weeks w
LEFT JOIN orders o ON o.day > (w.n - 1) * 7 AND o.day <= w.n * 7
GROUP BY w.n
ORDER BY w.n;`,
'no orders': `-- Correlated subqueries: each one probes the index on orders.customer_id.
SELECT c.name, c.city,
  (SELECT COUNT(*) FROM customers d WHERE d.city = c.city) AS in_city
FROM customers c
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)
ORDER BY c.name;`,
'update': `-- 10% off late monitors, then a report. Run it twice and the discount compounds.
UPDATE orders SET price = ROUND(price * 0.9)
WHERE product = 'monitor' AND day > 300;

SELECT product,
  COUNT(*) AS orders,
  SUM(CASE WHEN day > 300 THEN 1 ELSE 0 END) AS late,
  MIN(price) AS min_price,
  MAX(price) AS max_price
FROM orders
WHERE product IN (SELECT product FROM orders WHERE price > 100)
GROUP BY product
ORDER BY product;`,
};

// Demo data, generated with a fixed seed and loaded through the engine's own INSERT.
const db = SQL.Database();
let seed = 7;
const rnd = n => ((seed = seed * 1664525 + 1013904223 >>> 0) >>> 8) % n;   // the low bits of this generator repeat, so drop them
const CITIES = ['Katowice', 'Berlin', 'Lisbon', 'Austin', 'Tokyo', 'Toronto'];
const FIRST = ['Ada', 'Linus', 'Grace', 'Dennis', 'Barbara', 'Ken', 'Margaret', 'Bjarne', 'Radia', 'Guido'];
const PRODUCTS = [['keyboard', 89], ['monitor', 329], ['webcam', 59], ['usb hub', 25], ['desk lamp', 45], ['whiteboard', 120]];
const customers = Array.from({ length: 48 }, (_, i) => `(${i + 1}, '${FIRST[i % 10]} ${String.fromCharCode(65 + (i * 7) % 26)}.', '${CITIES[rnd(6)]}')`);
const orders = Array.from({ length: 1000 }, (_, i) => { const [p, price] = PRODUCTS[rnd(6)]; return `(${i + 1}, ${1 + rnd(45)}, '${p}', ${1 + rnd(5)}, ${price}, ${1 + rnd(365)})`; });
db.exec(`CREATE TABLE customers (id INT, name TEXT, city TEXT);
CREATE TABLE orders (id INT, customer_id INT, product TEXT, qty INT, price INT, day INT);
INSERT INTO customers VALUES ${customers.join(',')};
INSERT INTO orders VALUES ${orders.join(',')};
CREATE INDEX orders_day ON orders (day);
CREATE INDEX orders_customer ON orders (customer_id);`);

const $ = id => document.getElementById(id), src = $('src');
const cell = (tag, v) => { const e = document.createElement(tag); e.textContent = v == null ? 'NULL' : v; if (typeof v === 'number') e.className = 'num'; if (v == null) e.className = 'null'; return e; };

function run() {
  const status = $('status'), table = $('result'), plan = $('plan');
  table.replaceChildren(); plan.replaceChildren(); status.className = '';
  try {
    const t = performance.now(), res = db.exec(src.value).pop() || { message: 'nothing to run' }, ms = performance.now() - t;
    if (!res.columns) { status.textContent = res.message; }
    else {
      status.textContent = `${res.rows.length} row${res.rows.length === 1 ? '' : 's'} in ${ms.toFixed(1)} ms`;
      plan.append(...res.plan.map(s => cell('li', s)));
      const head = table.insertRow();
      res.columns.forEach((c, i) => { const th = cell('th', c); if (typeof (res.rows[0] || [])[i] === 'number') th.className = 'num'; head.append(th); });
      for (const r of res.rows.slice(0, 500)) table.insertRow().append(...r.map(v => cell('td', v)));
    }
  } catch (e) { status.className = 'err'; status.textContent = e.message; }
  $('schema').innerHTML = [...db.tables].map(([n, t]) => `<b>${n}</b> (${t.cols.join(', ')}) · ${t.rows.length} rows` +
    (t.indexes.length ? ` · B+tree on ${t.indexes.map(ix => t.cols[ix.col]).join(', ')}` : '')).join('<br>');
}

for (const name in EXAMPLES) { const b = document.createElement('button'); b.textContent = name; b.onclick = () => { src.value = EXAMPLES[name]; run(); }; $('examples').append(b, ' '); }
$('run').onclick = run;
src.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
src.value = EXAMPLES['top products'];
run();
</script>
</html>
